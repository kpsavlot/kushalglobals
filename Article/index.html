<script>
    document.addEventListener('partialsLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        const articleKey = params.get('article') || 'q2-momentum';

        fetch('articles.json')
            .then(r => r.json())
            .then(articles => {
                const article = articles[articleKey];
                if (!article) {
                    document.querySelector('main').innerHTML = '<div style="padding:4rem;text-align:center;"><h1>Article not found</h1><a href="../Blog/">Back to blog</a></div>';
                    return;
                }

                document.getElementById('page-title').textContent = article.title + ' | KUSHAL GLOBALS';
                document.getElementById('breadcrumb-label').textContent = article.breadcrumbLabel;
                document.getElementById('article-title').innerHTML = article.titleHtml;
                document.getElementById('article-date').textContent = article.date;
                document.getElementById('article-author').textContent = article.author;
                document.getElementById('article-read-time').textContent = article.readTime;
                document.getElementById('article-featured-image').src = article.featuredImage;
                document.getElementById('article-featured-image').alt = article.featuredAlt;
                document.getElementById('article-body').innerHTML = article.body;
                document.getElementById('article-author-image').src = article.authorImage;
                document.getElementById('article-author-image').alt = article.author;
                document.getElementById('article-author-quote').textContent = article.authorQuote;
                document.getElementById('article-author-name').textContent = article.authorName;

                const relatedContainer = document.getElementById('related-articles');
                relatedContainer.innerHTML = '';
                const relatedKeys = Object.keys(articles).filter(k => k !== articleKey);
                relatedKeys.slice(0, 3).forEach(function (key) {
                    const a = articles[key];
                    const card = document.createElement('div');
                    card.className = 'bg-surface-container-lowest rounded-xl overflow-hidden shadow-sm group hover:shadow-md transition-all border border-outline-variant/20 cursor-pointer';
                    card.addEventListener('click', function () {
                        window.location.href = '?article=' + key;
                    });
                    card.innerHTML =
                        '<div class="h-48 overflow-hidden">' +
                            '<img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" alt="' + a.featuredAlt.replace(/"/g, '&quot;') + '" src="' + a.featuredImage + '"/>' +
                        '</div>' +
                        '<div class="p-6">' +
                            '<span class="text-caption text-primary font-bold uppercase mb-2 block">' + a.cardCategory + '</span>' +
                            '<h3 class="font-headline-sm text-[20px] mb-4 text-on-background leading-snug">' + a.title + '</h3>' +
                            '<a class="flex items-center gap-2 text-primary font-label-md text-sm" href="?article=' + key + '">Read Insight <span class="material-symbols-outlined text-[16px]">north_east</span></a>' +
                        '</div>';
                    relatedContainer.appendChild(card);
                });
            })
            .catch(function () {
                document.querySelector('main').innerHTML = '<div style="padding:4rem;text-align:center;"><h1>Failed to load article</h1></div>';
            });
    });
</script>
