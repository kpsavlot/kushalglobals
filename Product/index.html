<script>
    document.addEventListener('partialsLoaded', function () {
        const params = new URLSearchParams(window.location.search);
        const productKey = params.get('product') || 'turmeric';

        fetch('products.json')
            .then(r => r.json())
            .then(data => {
                const products = data.products || [];
                const product = products.find(p => p.slug === productKey);
                if (!product) {
                    document.body.innerHTML = '<div style="padding:4rem;text-align:center;"><h1>Product not found</h1><a href="../Portfolio/">Back to products</a></div>';
                    return;
                }

                document.getElementById('page-title').textContent = product.name + ' | KUSHAL GLOBALS';
                document.getElementById('breadcrumb-product').textContent = product.name;
                document.querySelector('#quote-form input[name="product"]').value = product.name;
                document.getElementById('product-title').textContent = product.name;
                document.getElementById('product-hero-desc').textContent = product.heroDesc;
                document.getElementById('hero-bg').style.backgroundImage = 'url(' + product.heroBg + ')';
                document.getElementById('product-badge').textContent = product.badge;
                document.getElementById('product-sku').textContent = 'SKU: ' + product.sku;
                document.getElementById('product-headline').textContent = 'Product Specifications';
                document.getElementById('product-description').textContent = product.description;
                document.getElementById('product-origin').textContent = product.origin;
                document.getElementById('product-variety').textContent = product.variety;
                document.getElementById('product-packing').textContent = product.packing;
                document.getElementById('product-logistics').textContent = product.logistics;

                const images = product.images;
                const mainImg = document.getElementById('main-product-image');
                mainImg.alt = product.name;
                mainImg.src = images[0];

                const dotsContainer = document.getElementById('dot-indicators');
                const thumbsContainer = document.getElementById('thumbnails');
                dotsContainer.innerHTML = '';
                thumbsContainer.innerHTML = '';

                images.forEach((src, i) => {
                    const dot = document.createElement('span');
                    dot.dataset.index = i;
                    dot.className = i === 0
                        ? 'w-10 h-1.5 bg-primary rounded-full transition-all duration-300'
                        : 'w-4 h-1.5 bg-white/50 rounded-full hover:bg-white transition-all cursor-pointer';
                    dotsContainer.appendChild(dot);

                    const thumb = document.createElement('div');
                    thumb.dataset.index = i;
                    thumb.className = i === 0
                        ? 'aspect-square rounded-xl border-2 border-primary overflow-hidden cursor-pointer shadow-sm'
                        : 'aspect-square rounded-xl border border-outline-variant overflow-hidden cursor-pointer hover:border-primary transition-all opacity-70 hover:opacity-100';
                    const img = document.createElement('img');
                    img.alt = product.name + ' ' + (i + 1);
                    img.className = 'w-full h-full object-cover';
                    img.src = src;
                    thumb.appendChild(img);
                    thumbsContainer.appendChild(thumb);
                });

                let current = 0;
                const dots = dotsContainer.querySelectorAll('span');
                const thumbs = thumbsContainer.querySelectorAll('div');

                function updateGallery(index) {
                    current = index;
                    mainImg.src = images[current];
                    dots.forEach((dot, i) => {
                        dot.className = i === current
                            ? 'w-10 h-1.5 bg-primary rounded-full transition-all duration-300'
                            : 'w-4 h-1.5 bg-white/50 rounded-full hover:bg-white transition-all cursor-pointer';
                    });
                    thumbs.forEach((thumb, i) => {
                        thumb.className = i === current
                            ? 'aspect-square rounded-xl border-2 border-primary overflow-hidden cursor-pointer shadow-sm'
                            : 'aspect-square rounded-xl border border-outline-variant overflow-hidden cursor-pointer hover:border-primary transition-all opacity-70 hover:opacity-100';
                    });
                }

                document.getElementById('prev-btn').addEventListener('click', () => {
                    updateGallery(current === 0 ? images.length - 1 : current - 1);
                });
                document.getElementById('next-btn').addEventListener('click', () => {
                    updateGallery(current === images.length - 1 ? 0 : current + 1);
                });
                thumbs.forEach(thumb => {
                    thumb.addEventListener('click', () => updateGallery(parseInt(thumb.dataset.index)));
                });
                dots.forEach(dot => {
                    dot.addEventListener('click', () => updateGallery(parseInt(dot.dataset.index)));
                });
            })
            .catch(() => {
                document.body.innerHTML = '<div style="padding:4rem;text-align:center;"><h1>Failed to load product data</h1></div>';
            });
    });
</script>
<script>
    (function () {
        const form = document.getElementById('quote-form');
        const status = document.getElementById('quote-form-status');
        if (!form || !window.emailjs || !window.EMAILJS_CONFIG) return;

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            const btn = form.querySelector('button[type="submit"]');
            btn.disabled = true;
            status.textContent = 'Sending your inquiry...';
            status.className = 'text-center text-sm font-bold text-on-surface-variant';

            emailjs.sendForm(window.EMAILJS_CONFIG.quote.serviceId, window.EMAILJS_CONFIG.quote.templateId, form, { publicKey: window.EMAILJS_CONFIG.publicKey })
            .then(function () {
                status.textContent = 'Thank you! Your quote request has been sent. We will get back to you shortly.';
                status.className = 'text-center text-sm font-bold text-primary';
                form.reset();
                form.product.value = document.getElementById('breadcrumb-product').textContent;
            })
            .catch(function () {
                status.textContent = 'Something went wrong. Please try again or email info@kushalglobals.com directly.';
                status.className = 'text-center text-sm font-bold text-error';
            })
            .finally(function () {
                btn.disabled = false;
            });
        });
    })();
</script>
