<script>
    // Smooth scroll
    document.querySelectorAll('a[href^="#"]').forEach(anchor => {
        anchor.addEventListener('click', function (e) {
            e.preventDefault();
            const target = document.querySelector(this.getAttribute('href'));
            if (target) {
                window.scrollTo({
                    top: target.offsetTop - 120,
                    behavior: 'smooth'
                });
            }
        });
    });

    // Blog cards from articles.json
    document.addEventListener('partialsLoaded', function () {
        fetch('../Article/articles.json')
            .then(r => r.json())
            .then(data => {
                const grid = document.getElementById('blog-grid');
                const articles = data.articles || [];
                grid.innerHTML = '';
                articles.forEach(function (a) {
                    const card = document.createElement('article');
                    card.className = 'group border border-outline-variant bg-surface-container-lowest overflow-hidden transition-all duration-300 hover:shadow-xl';
                    card.innerHTML =
                        '<div class="aspect-[16/10] overflow-hidden relative">' +
                            '<img loading="lazy" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110" alt="' + (a.featuredAlt || '').replace(/"/g, '&quot;') + '" src="' + a.featuredImage + '"/>' +
                            '<div class="absolute top-4 left-4 bg-primary text-on-primary px-3 py-1 text-caption uppercase tracking-wider">' + a.cardCategory + '</div>' +
                        '</div>' +
                        '<div class="p-6">' +
                            '<span class="text-caption text-secondary mb-2 block">' + a.date + '</span>' +
                            '<h3 class="font-headline-sm text-on-background mb-3 group-hover:text-primary transition-colors">' + a.title + '</h3>' +
                            '<p class="text-on-surface-variant text-body-md line-clamp-3 mb-4">' + a.cardDesc + '</p>' +
                            '<a class="inline-flex items-center gap-2 text-primary font-label-md hover:gap-4 transition-all" href="../Article/?article=' + a.slug + '">' +
                                'VIEW BRIEFING <span class="material-symbols-outlined text-[18px]">arrow_forward</span>' +
                            '</a>' +
                        '</div>';
                    grid.appendChild(card);
                });
            })
            .catch(function () {
                document.getElementById('blog-grid').innerHTML = '<p class="text-on-surface-variant">Unable to load articles.</p>';
            });
    });
</script>
